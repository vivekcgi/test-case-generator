gqlapi: 1.0.0
info:
  title: Sysml Server
  description: This is sysml server
  version: 1.0.0
queries:
  projects:
    tags:
      - project
      - query
    summary: Get all projects
    description: Get all projects
    variables:
      searchText:
        type: string
        required: false
        example: "Element"
      filterInput:
        required: false
        type: object
        properties:
          projectId:
            type: string
            required: false
            example: "qwert-12345-adefrt-qwertyghyuj"
          name:
            type: string
            required: false
            example: "SampleProject"
          description:
            type: string
            required: false
            example: "Description for SampleProject"
          createdBy:
            type: string
            required: false
            example: "2024-06-08"
          created:
            type: string
            required: false
            example: "user-1"
          lastModified:
            type: string
            required: false
            example: "2024-06-08"
    output:
      200:
        description: Successful operation
        contentType: application/json
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                properties:
                  name:
                    type: string
                    required: true
                    example: "SampleProject"
                  projectId:
                    type: string
                    required: true
                    example: "1234-1234-1234-1234567890"
                  elementType:
                    type: string
                    required: false
                    example: "Project"
                  root:
                    type: object
                    properties:
                      elementId:
                        type: string
                        example: "1234-1234-1234-987654320"
                      elementType:
                        type: string
                        example: "Package"
                  description:
                    type: string
                    example: "some description"
            totalRecords:
              type: integer
              example: 100
      401:
        description: Unauthenticated
      403:
        description: Forbidden

mutations:
  createProject:
    tags:
      - create project
      - mutation
    summary: create a projects
    description: create a projects
    variables:
      input:
        type: object
        required: true
        properties:
          name:
            type: string
            required: true
            example: "SampleProject"
          description:
            type: string
            required: false
            example: "Description of SampleProject"
          templateId:
            type: string
            required: false
            example: "simple-template-id"
    output:
      200:
        description: Project created
        contentType: application/json
        schema:
          type: object
          properties:
            name:
              type: string
              required: true
              example: "SampleProject"
            projectId:
              type: integer
              required: true
              example: "qwert-12345-adefrt-qwertyghyuj"
            elementType:
              type: string
              required: false
              example: "Project"
            root:
              type: object
              properties:
                elementId:
                  type: string
                  required: true
                  example: "1234-1234-1234-987654320"
                elementType:
                  type: string
                  required: true
                  example: "Package"
      400:
        description: Project already exists
      401:
        description: Unauthenticated
      403:
        description: Forbidden
