name: Docker Image CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test
      run: |
        echo ${{ secrets.DOCKER_USERNAME }}
        echo ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Login to the docker repository
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Building the Docker image
      run: |
        COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
        docker build -t ${{ secrets.DOCKER_USERNAME }}/tsg-server:$COMMIT_SHA ./backend
        docker tag ${{ secrets.DOCKER_USERNAME }}/tsg-server:$COMMIT_SHA

    - name: Push image to docker
      run: |
        COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
        docker push ${{ secrets.DOCKER_USERNAME }}/tsg-server:$COMMIT_SHA ${{ secrets.DOCKER_USERNAME }}/tsg-server:$COMMIT_SHA
