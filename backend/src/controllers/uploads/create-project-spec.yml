openapi: 3.0.0
info:
  title: Create Project API
  version: 1.0.0
  description: Endpoint to create a new project.
servers:
  - url: https://api.example.com/v1
paths:
  /projects:
    post:
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: My Project
                description:
                  type: string
                  example: This is a test project
      responses:
        "200":
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: project created
                  project:
                    type: object
                    properties:
                      "@id":
                        type: string
                        example: "123456"
                      "@type":
                        type: string
                        example: Project
                      created:
                        type: string
                        example: "2024-03-20T12:00:00Z"
                      defaultBranch:
                        type: object
                        properties:
                          "@id":
                            type: string
                            example: "789012"
                      description:
                        type: string
                        example: This is a test project
                      name:
                        type: string
                        example: My Project
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Project exists
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: something went wrong
      security:
        - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
